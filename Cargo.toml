[package]
name = "xmeta"
version = "0.6.0"
edition = "2021"
description = "Custom file properties. Manage files like a database."

[lib]
name = "fs_meta"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xmeta"
path = "src/bin/xmeta/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sqlite-loadable = "0.0.6-alpha.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
