name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: libfs_meta.dylib
            cli_name: xmeta
            raw_output: libfs_meta-aarch64-apple-darwin.dylib
            archive_ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            binary_name: libfs_meta.dylib
            cli_name: xmeta
            raw_output: libfs_meta-x86_64-apple-darwin.dylib
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: libfs_meta.so
            cli_name: xmeta
            raw_output: libfs_meta-x86_64-unknown-linux-gnu.so
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: fs_meta.dll
            cli_name: xmeta.exe
            raw_output: fs_meta-x86_64-pc-windows-msvc.dll
            archive_ext: zip
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: libfs_meta.so
            cli_name: xmeta
            raw_output: libfs_meta-aarch64-unknown-linux-gnu.so
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check and test native metadata behavior
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --lib --locked

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          src_bin="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          
          # Copy raw binary with target-suffixed name
          cp "$src_bin" "dist/${{ matrix.raw_output }}"

          # Create staging folder for compressed archive
          mkdir -p staging
          cp "$src_bin" staging/
          if [[ "${{ matrix.os }}" == macos* ]]; then
            cp staging/libfs_meta.dylib staging/lib_fs_meta.dylib
          elif [[ "${{ matrix.os }}" == ubuntu* ]]; then
            cp staging/libfs_meta.so staging/lib_fs_meta.so
          fi

          tag="${GITHUB_REF_NAME:-snapshot}"
          archive_base="fs_meta-${tag}-${{ matrix.target }}"

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            if command -v 7z >/dev/null 2>&1; then
              (cd staging && 7z a "../dist/${archive_base}.zip" .)
            elif command -v zip >/dev/null 2>&1; then
              (cd staging && zip -r "../dist/${archive_base}.zip" .)
            else
              tar -czf "dist/${archive_base}.tar.gz" -C staging .
            fi
          else
            tar -czf "dist/${archive_base}.tar.gz" -C staging .
          fi

          # Package the native CLI separately so extension downloads stay unchanged.
          cli_src="target/${{ matrix.target }}/release/${{ matrix.cli_name }}"
          if [[ "${{ matrix.cli_name }}" == *.exe ]]; then
            cp "$cli_src" "dist/xmeta-${{ matrix.target }}.exe"
          else
            cp "$cli_src" "dist/xmeta-${{ matrix.target }}"
          fi

          mkdir -p staging-cli
          cp "$cli_src" staging-cli/
          cli_archive_base="xmeta-${tag}-${{ matrix.target }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            if command -v 7z >/dev/null 2>&1; then
              (cd staging-cli && 7z a "../dist/${cli_archive_base}.zip" .)
            elif command -v zip >/dev/null 2>&1; then
              (cd staging-cli && zip -r "../dist/${cli_archive_base}.zip" .)
            else
              tar -czf "dist/${cli_archive_base}.tar.gz" -C staging-cli .
            fi
          else
            tar -czf "dist/${cli_archive_base}.tar.gz" -C staging-cli .
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/

      - name: Prepare release assets & checksums
        run: |
          mkdir -p release-assets
          find downloaded/ -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Publish GitHub Release (Tag Trigger)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md

      - name: Publish Snapshot Release (Manual Trigger)
        uses: softprops/action-gh-release@v2
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          tag_name: snapshot
          name: "Snapshot Build (${{ github.sha }})"
          prerelease: true
          files: release-assets/*
